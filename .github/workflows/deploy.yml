name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        # `npm ci` is stricter but trips over platform-specific optional deps that
        # macOS-generated lockfiles don't record (notably @emnapi/* on Linux). Using
        # `npm install` with the existing lockfile is functionally equivalent for
        # version resolution and tolerates the cross-platform gap.
        run: npm install --no-audit --no-fund
      - name: Copy sql.js WASM into public/
        run: cp node_modules/sql.js/dist/sql-wasm.wasm public/sql-wasm.wasm
      - name: Build site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
